<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forage magique de Martin</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#e9e4da; --panel:#f7f3ea; --text:#231c14; --muted:#6f6355; --line:#d3c8b6;
  --hiviz:#ffc20e; --hivizText:#2a2000; --good:#2f8a5b; --bad:#c23b2a; --card:#fffdf8; --core:#7b4bd6;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#16130f; --panel:#221d17; --text:#f2eadc; --muted:#a8998a; --line:#3b3229;
  --good:#4cc98a; --bad:#ff6a55; --card:#2a241d; --core:#b08cff; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#16130f; --panel:#221d17; --text:#f2eadc; --muted:#a8998a; --line:#3b3229;
  --good:#4cc98a; --bad:#ff6a55; --card:#2a241d; --core:#b08cff; color-scheme:dark; }
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
#hud{padding:9px 14px 7px;background:var(--panel);border-bottom:3px solid var(--hiviz);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
#money{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#mps{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.right{text-align:right}
#depth{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
#layer{font-size:.82rem;color:var(--muted)}
#shaftWrap{position:relative;height:40vh;min-height:220px;flex:none;overflow:hidden}
#shaft{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--hiviz);color:var(--hivizText);
  font-weight:800;padding:7px 14px;border-radius:999px;font-size:.9rem;pointer-events:none;box-shadow:0 2px 0 #b88a00;white-space:nowrap}
#hint[hidden]{display:none}
#dyn{position:absolute;right:10px;bottom:10px;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:#c23b2a;color:#fff;
  font-size:1.6rem;box-shadow:0 3px 8px rgba(0,0,0,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
#dyn small{font-size:.6rem;font-weight:800;margin-top:2px}
#dyn.wait{background:#5a5048;cursor:default}
#dyn[hidden]{display:none}
#frenzy{position:absolute;left:10px;top:10px;background:#ff2d6b;color:#fff;font-weight:800;padding:5px 10px;border-radius:8px;font-size:.85rem}
#frenzy[hidden]{display:none}
#trophyBtn{position:absolute;right:58px;top:10px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:1.2rem;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.pbar{height:6px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--hiviz)}
.vit{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line)}.vit span:nth-child(2){flex:1}.vit small{display:block;color:var(--muted);font-size:.78rem}.stars{color:#e0a800;letter-spacing:1px}
#cloudBtn{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:1.2rem;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
#adBubble{position:absolute;left:-70px;z-index:6;width:58px;height:58px;border-radius:50%;border:3px solid #fff;font-weight:900;font-size:1.25rem;color:#2a2000;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc20e 55%,#e08a00);box-shadow:0 0 18px rgba(255,210,60,.9);animation:adFloat 20s linear forwards,adBob 1.2s ease-in-out infinite alternate}
#adBubble[hidden]{display:none}
@keyframes adFloat{from{left:-70px}to{left:calc(100% + 70px)}}
@keyframes adBob{from{margin-top:-8px}to{margin-top:8px}}
#adOv{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:adFlash 1.2s steps(1) infinite}
#adOv[hidden]{display:none}
@keyframes adFlash{0%{background:#1e5bff}20%{background:#18c24a}40%{background:#ff2a2a}60%{background:#ffd21e}80%{background:#c02aff}}
#adTxt{font-size:3.2rem;font-weight:900;color:#fff;text-shadow:0 4px 0 #000,0 0 20px #000;letter-spacing:.06em;transform:rotate(-6deg)}
#adCnt{font-size:4rem;font-weight:900;color:#fff;text-shadow:0 3px 0 #000;margin-top:16px;min-height:4.5rem}
#adX{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#000;color:#fff;font-size:1.4rem;font-weight:900;cursor:pointer}
#adX[hidden]{display:none}
.godline{margin:14px 0 0;text-align:center;font-weight:900;color:#d4a000;text-shadow:0 0 8px rgba(255,210,60,.6)}
@media (prefers-reduced-motion:reduce){#adOv{animation-duration:3s}}
#toast{position:fixed;z-index:40;left:50%;top:30%;transform:translate(-50%,-50%);background:rgba(20,16,12,.9);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:1rem;font-weight:700;max-width:88%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#tabs{display:flex;background:var(--panel);border-top:1px solid var(--line)}
#tabs button{flex:1;min-width:0;position:relative;border:none;background:none;color:var(--muted);padding:12px 1px;font-size:.72rem;font-weight:700;border-bottom:3px solid transparent;cursor:pointer}
#tabs button.on{color:var(--text);border-bottom-color:var(--hiviz)}
#tabs button.dot::after{content:"";position:absolute;top:8px;right:10%;width:8px;height:8px;border-radius:4px;background:var(--bad)}
#list{flex:1;overflow-y:auto;padding:10px 12px 16px;-webkit-overflow-scrolling:touch}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;cursor:pointer}
.seg button.on{background:var(--hiviz);color:var(--hivizText);border-color:transparent}
.sec{margin:14px 2px 8px;font-size:.95rem;font-weight:800;color:var(--muted)}
.sec:first-child{margin-top:2px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;margin:0 0 8px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--text);text-align:left;font-size:1rem;cursor:pointer}
.item .ic{font-size:1.55rem;width:36px;text-align:center;flex:none}
.item .txt{flex:1;min-width:0}
.item b{font-weight:700}
.item small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px;line-height:1.3}
.item .own{float:right;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);margin-left:6px}
.item .price{flex:none;font-weight:800;font-variant-numeric:tabular-nums;background:var(--hiviz);color:var(--hivizText);padding:6px 9px;border-radius:9px;font-size:.88rem;text-align:center}
.item.no .price{background:var(--line);color:var(--muted)}
.item.done{cursor:default}
.item.done .price{background:none;color:var(--good)}
.item.locked{opacity:.5;cursor:default}
.item.perk .price{background:var(--core);color:#fff}
.item.perk.no .price{background:var(--line);color:var(--muted)}
.item.perk.done .price{background:none;color:var(--good)}
.item:active:not(.no):not(.locked):not(.done){transform:scale(.98)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.45}
.box p{margin:0 0 10px}
.big{font-size:1.35rem;font-weight:800}
.coreTxt{color:var(--core)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--core);color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;margin-top:6px}
.btn.arm{background:var(--bad)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default}
button.price{border:none;cursor:pointer;font-family:inherit}
.abtn{background:var(--core)!important;color:#fff!important;white-space:nowrap}
.abtn.dim{background:var(--line)!important;color:var(--muted)!important;cursor:default}
.tog{border:1px solid var(--line);background:var(--card);color:var(--good);border-radius:9px;padding:5px 8px;font-weight:800;font-size:.8rem;cursor:pointer;font-family:inherit}
.tog.paused{color:var(--muted)}
.tog.chip{color:var(--muted);font-weight:700}
.tog.chip.on{background:rgba(47,138,91,.15);color:var(--good);border-color:var(--good)}
.tog:disabled{opacity:.45;cursor:default}
.tog.cancel{color:var(--bad);margin-top:8px;width:100%}
.tog[hidden]{display:none}
.link{background:none;border:none;color:var(--bad);padding:14px 0 2px;font-size:.88rem;cursor:pointer}
button:focus-visible{outline:3px solid var(--hiviz);outline-offset:2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
#modal[hidden]{display:none}
.sheet{background:var(--panel);width:100%;max-width:420px;max-height:86vh;overflow-y:auto;border-radius:18px;padding:20px;border-top:5px solid var(--hiviz);line-height:1.45}
.sheet h2{margin:0 0 8px}
.sheet .btn{background:var(--hiviz);color:var(--hivizText)}
#boom{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;pointer-events:none;
  background:radial-gradient(circle,#fff6c2 0%,#ff9a3c 35%,#7b1d0e 70%,#160a05 100%);animation:boom 3.2s ease-out forwards}
#boom[hidden]{display:none}
#boom h1{font-size:2.3rem;margin:0 0 8px;text-shadow:0 3px 12px rgba(0,0,0,.6);animation:pop 3.2s ease-out}
#boom p{font-size:1.3rem;font-weight:800;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes boom{0%{opacity:0;transform:scale(1.3)}8%{opacity:1;transform:scale(1) translate(8px,-6px)}12%{transform:translate(-10px,8px)}16%{transform:translate(9px,5px)}20%{transform:translate(-6px,-8px)}26%{transform:translate(4px,4px)}32%{transform:none}80%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{transform:scale(.2)}20%{transform:scale(1.25)}35%{transform:scale(1)}}
#app.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
@media (prefers-reduced-motion:reduce){#boom,#boom h1,#app.shake{animation-duration:.01s}#boom{animation:none;opacity:1}}
</style>
</head>

function runAuto(k){
  const pick=(list)=>{ let best=null; for(const o of list){ if(o.c<=s.money&&(!best||o.c<best.c)) best=o; } if(best){ s.money-=best.c; best.f(); return true; } return false; };
  if(k==="rigs") return pick(RIGS.map((r,i)=>({i,c:rigCost(i,1)})).filter(o=>rigUnlocked(o.i)&&(o.i===0||s.rigs[o.i-1]>0||s.rigs[o.i]>0||!!RIGS[o.i].tech)).map(o=>({c:o.c,f:()=>s.rigs[o.i]++})));
  if(k==="rigup") return pick(RIGS.map((r,i)=>i).filter(rigUpReady).map(i=>({c:rigUpCost(i),f:()=>s.rigUp[i]++})));
  if(k==="ups") return pick(UPS.filter(u=>s.up[u.k]<u.max).map(u=>({c:upCost(u),f:()=>s.up[u.k]++})));
  if(k==="bld") return pick(BLD.filter(b=>s.b[b.k]<b.max).map(b=>({c:bCost(b),f:()=>s.b[b.k]++})));
  if(k==="shaft") return s.shafts<MAX_SHAFTS&&pick([{c:shaftCost(),f:()=>s.shafts++}]);
  if(k==="rocket"){ const sp=SP(); if(!sp.silo) return false; let did=false; if(canBuildRocket()){ buildRocket(); did=true; }
    if(sp.rockets>0){ const cands=COLS.filter(c=>founded(c.k)&&canSend(c)&&!sp.flights.some(f=>f.to===c.k)).sort((a,b)=>sp.col[a.k].sup-sp.col[b.k].sup); if(cands.length&&sp.col[cands[0].k].sup-Date.now()<18*3600000){ sendRocket(cands[0].k,"sup"); did=true; } } return did; }
  if(k==="smelt"){ if(!s.p.fond||!s.p.furn.some(j=>!j)) return false; const sel=s.p.autoSmelt||{}, busy=new Set(s.p.furn.filter(j=>j).map(j=>j.k)); let best=null;
    INGOTS.forEach(I=>{ if(!sel[I.k]||busy.has(I.k)) return; const n=maxSmelt(I.k); if(n>0&&(!best||n>best.n)) best={k:I.k,n}; }); return best?startSmelt(best.k,best.n):false; }
  return false;
}

    if(!n){ say("❌ Ce code n’est pas valide. Vérifie qu’il est complet (il commence par FP2:).",false); return; }
    const same=JSON.stringify(n.rigs)===JSON.stringify(s.rigs)&&Math.abs((n.money||0)-s.money)<=Math.max(1,s.money*.05)&&(n.g&&n.g.planet)===s.g.planet&&Math.abs((n.depth||0)-s.depth)<=Math.max(1,s.depth*.05);
    if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Confirmer : charger cette partie"; b.style.background="var(--bad)";
      say(`Ce code contient : <b>${summary(n)}</b>.${same?"<br>ℹ️ C’est la même partie que celle en cours : rien ne va changer.":""}<br>Touche le bouton rouge pour la charger.`,true); return; }
    $("modal").hidden=true; adopt(n); cloudSave(); setTimeout(()=>modal("Partie chargée",`Tu joues maintenant : <b>${summary(s)}</b>.`),300); };
}

    badges();
  }
  secAcc+=dt; if(secAcc>1){ const sdt=secAcc; secAcc=0; asmTick(sdt);
    { const nw=Date.now(); if(!s.nextAd||s.nextAd>nw+20*60000) s.nextAd=nw+(12+Math.random()*6)*60000; if(nw>=s.nextAd&&!adShown&&$("modal").hidden&&!battle){ s.nextAd=nw+(12+Math.random()*6)*60000; showAdBubble(); } }
    { const d=DF(), nw=Date.now(); if(!d.on&&raceActive(0)){ d.on=1; d.next=nw+WAVE_EVERY; d.known=[0]; save(); setTimeout(()=>modal("👽 Alerte : des aliens!","Ton forage a réveillé quelque chose. Des Rampants 🐛 vont attaquer ta base sur Terre dans 10 min, puis une vague revient toutes les 10 minutes. Si une vague perce, ils pillent tout ton argent. Va dans le nouvel onglet Défense pour installer des mitrailleuses et renforcer ton mur."),800); }
      if(d.on){ activeRaces().forEach(rr=>{ if(!d.known.includes(rr)){ d.known.push(rr); d.next=Math.max(d.next,nw+WAVE_EVERY); d.warned=0; save(); setTimeout(()=>modal(`👽 Nouvelle race : ${RACES[rr].n} ${RACES[rr].i}`,`Ta colonie sur ${PLANETS[rr].the} a attiré une nouvelle espèce. Elle attaquera la Terre dès la prochaine vague, dans 10 min au plus. Ton arme la plus efficace : ${TURRETS[rr].i} ${TURRETS[rr].n}, faite avec les matériaux de ${PLANETS[rr].the}.`),1200); } });
        if(!battle&&d.next-nw<120000&&d.next>nw&&!d.warned&&!waveOutcome().win){ d.warned=1; toast("👽 Vague dans moins de 2 min, et tu n’es pas prêt!"); }
        if(!battle&&nw>=d.next){ d.warned=0; startBattle(true); } } } const sev=spaceTick(Date.now()); sev.forEach((m,i)=>setTimeout(()=>toast(m),i*2200)); if(sev.length) save();
    const got=checkAch(); got.forEach((a,i)=>setTimeout(()=>toast(`🏆 Succès : ${a.n}`),i*1800));
    const f=tickFurn(); if(f.done.length) toast(`🔥 Four : ${f.done.map(j=>j.n+" × "+INGOTS.find(x=>x.k===j.k).n.toLowerCase()).join(", ")}, c’est prêt`);
    if(f.forged){ shakeApp(); modal(f.forged.rocket?"Prêt au décollage!":"Trépan forgé!",f.forged.rocket?(f.forged.art==="le"?`Ton <b>${f.forged.n.toLowerCase()}</b> est prêt.`:`Ta <b>${f.forged.n.toLowerCase()}</b> est prête.`):`Ton <b>${f.forged.n}</b> est prêt. ${f.forged.d}.${!f.forged.holder&&s.p.equip.includes(f.forged.k)?" Il est déjà équipé.":" Va dans la fonderie pour l’équiper."}`+(f.forged.rocket?" Va dans l’onglet Claim pour lancer l’expédition.":"")); }
    if(got.length||f.done.length||f.forged) save(); }
  saveAcc+=dt; if(saveAcc>5){ saveAcc=0; save(); updCloud(); }
  cloudAcc+=dt; if(cloudAcc>60){ cloudAcc=0; cloudSave(); }
  requestAnimationFrame(loop);
}

// ---------- démarrage ----------
const had=load(), bootTs=had?s.lastTs:0;
if(had&&s.convertedSpace){ delete s.convertedSpace; setTimeout(()=>modal("La Terre devient ta base!","Tu restes maintenant sur Terre pour de bon. Les planètes que tu avais déjà explorées sont devenues des colonies : va dans l’onglet Espace pour construire l’atelier, le silo et les fusées qui rapporteront leurs matériaux."),1500); }
if(had){ catchUp((Date.now()-s.lastTs)/1000,(Date.now()-s.lastTs)>60000); if(s.depth>1) $("hint").hidden=true; }
else scheduleFilon();
lastLayerIdx=PL().layers.indexOf(layerAt(s.depth));
$("cloudBtn").addEventListener("click",openSave);
initCloud(bootTs);
addEventListener("resize",resize);
addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ save(); cloudSave(); } else { const n=Date.now(); if(n-lastWall>3000){ catchUp((n-lastWall)/1000,n-lastWall>60000); lastWall=n; } } });
resize(); build(); save();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
